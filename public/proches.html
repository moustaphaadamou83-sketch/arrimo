<!doctype html>
<html lang="fr-CA" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrimo · Portail des proches</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#0E5E6F">
<link rel="manifest" href="/proches.webmanifest">
<link rel="apple-touch-icon" href="/icone-proches-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arrimo Famille">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">
<script src="apparence.js"></script>
<link rel="stylesheet" href="style.css">
<style>
  /* Portail des proches : grands caractères et grands boutons, lisible sur téléphone et tablette */
  body.portail { font-size: 18px; }
  .portail main { max-width: 720px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .portail .btn { min-height: 52px; font-size: 18px; padding: 0 20px; }
  .portail input, .portail select, .portail textarea { min-height: 52px; font-size: 18px; width: 100%; }
  .portail textarea { min-height: 120px; }
  .portail .tete { background: var(--principal-plein); color: #fff; padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .portail .tete h1 { font-size: 22px; margin: 0; color: #fff; }
  .portail .message { border: 1px solid var(--bordure); border-radius: var(--rayon-carte); padding: 12px 14px; background: var(--carte); }
  .portail .message.proche { border-left: 6px solid var(--secondaire); }
  .portail .message.etablissement { border-left: 6px solid var(--principal); }
  .portail .fil { display: flex; flex-direction: column; gap: 10px; }
  .portail .note { font-size: 16px; }
  .portail main { padding-bottom: 96px; }
  .carte-f h2 { margin-top: 0; }
  #carte-resident { border-left: 6px solid var(--principal); }
  .statut-f { font-size: 20px; margin: 8px 0 4px; }
  .actions-f { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .ligne-f { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--bordure); flex-wrap: wrap; }
  .confirmation-f { padding: 10px 0; border-bottom: 1px solid var(--bordure); }
  .frise { list-style: none; padding: 0; margin: 12px 0; }
  .frise li { display: flex; gap: 12px; padding: 8px 0; position: relative; }
  .frise .point { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--texte-2, #64748B); flex: none; margin-top: 4px; }
  .frise li.fait .point { background: var(--principal); border-color: var(--principal); }
  .frise li.attente { opacity: .75; }
  .barre-f { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--carte); border-top: 1px solid var(--bordure); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 10; }
  .barre-f button { flex: 1; min-height: 52px; background: none; border: 0; color: var(--texte); font-size: 14px; font-weight: 600; border-radius: 10px; }
  .barre-f button[aria-current="page"] { background: var(--principal); color: #fff; }
  .pastille-f { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--critique, #DC2626); color: #fff; font-size: 12px; }
  .fraicheur { margin: 0; }
  .actions-f .btn { white-space: normal; height: auto; min-height: 52px; padding: 8px 12px; line-height: 1.25; }
</style>
</head>
<body class="portail">
<header class="tete"><h1 id="titre">Portail des proches</h1>
  <div class="bascule-langue" role="group" aria-label="Langue"><button type="button" class="barre-btn" data-langue="fr">FR</button><button type="button" class="barre-btn" data-langue="en">EN</button></div></header>
<main id="contenu" aria-live="polite"></main>
<script src="proches.js"></script>
</body>
</html>
