# Contrôle automatique à chaque envoi : ne publie rien et n'utilise aucun secret.
# La recette complète et la publication restent lancées à la main, avec leurs preuves.
name: Contrôle
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: arrimo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dépendances vulnérables (élevées ou critiques)
        run: npm audit --omit=dev --audit-level=high
      - name: Aucun fichier de secrets suivi par Git
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.dump$|\.pem$|acces-demo'; then exit 1; fi
      - name: Tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/arrimo_test
